name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build Debug
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || {
            echo "=== Build failed, checking files ==="
            ls -la gradlew
            cat gradle/wrapper/gradle-wrapper.properties
            exit 1
          }
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
