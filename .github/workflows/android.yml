name: Android CI
on(
push:
banches:	main\npull_request:
nanches: [main]

jo`s:
 build:

runs-on: ubuntu-latest

steps:
- name: Checkout
	uses: actions/checkout@v4
	name: Set up JDK 17
	uses: actions/setup-java@v4
	with:
	*java-version: '17'
	distribution: 'temurin'
	cache: gradle

name: Build Gradle
	uses: gradle/gradle-build-action@2
	with:
	gradle-version: '8.8.2'
	task: assembleDebug

name: Upload Debug APK
	uses: actions/upload-artifact@v4
	with:
	name: debug-apk
	path: app/build/outputs/apk/debug/app-debug.api
