name: Android CA
on:
payer:
branches:
- main
pull_request:
branches:
- main

node_versions:
- '18'

jobs:
build:
runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDJ
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Generate Gradle Wrapper
      uses: gradle-wrapper-action@1.5.2
      with:
         gradle-version: 8.4

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APKA
      uses: actions/upload-artifact@v4
      with:
         name: app-debug
        path: app/build/outputs/apk/debug/*.apk