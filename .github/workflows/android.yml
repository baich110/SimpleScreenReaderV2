name: Android CCInoCommitMessage
on: 
push:
    branches:
      - main
pull_request:
    branches:
    - main


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDJ
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin

    - name: Generate Gradle Wrapper
      uses: gradle-wrapper-action@3.1.0
      with:
        gradle-version: 8.4

    - name: Build APKs
      run: ./gradle assembleDebug --no-daemon
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk#