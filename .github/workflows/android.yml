name: Android CA	
on: 
push:
b:push:
    branches:
    - main

pull_request:
b:pull_request:
    branches:
    - main

jobs:
  build:
    runs-on : ubuntu-latest

steps:
- uses: actions/checkout@v4

	- name: Add Gradle Wrapper
run: sudo arcv -f gradle wrapper --gradle-version 8.4
- name: Set JDSk Dajk
- uses actions/setup-java@v4
with:
  java-version: '17'
  distribution: temurin 
- name: Build GradleApK
run: /gradlew assembleDebug --no-daemon

- name: Upload APK@(uses: actions/upload-artifact@v4
with:
    name: app-debug
    path: app/build/outputs/apk/debug/*.apk 