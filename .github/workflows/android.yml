name: Android CC
h: push
  branches: main
pull_request:
  branches: main

jjobs: build:
  runs-on: ubuntu-latest

  steps:
  - uses: actions/checkout@v4

  - name: Setup JDJ
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: temurin

	 - name: Generate Argument	 
    uses: gradle-wrapper-action@3.1.0
		 with: gradle-version: 8.4
		 - name: Build APk	$	    run: ./gradlew assembleDebug --no-daemon
		 - name: Upload APK		   uses: actions/upload-artifact@v4
	    with:			  name: app-debug
        path: app/build/outputs/apk/debug/*.apk#