name: Android CI
on
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      uses: actions/checkout@v4
      setup-java-v4:
        with:
          java-version: '17'
          distribution: temurin
      build-gradle:checkout-v4
        with:
          java-version: '17'
    build:
      run: ./gradlew assembleDebug --no-daemon
    upload-artifact-v4:
      with:
        name: app
        path: app/build/outputs/apk/debug/*.apk